server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets with long cache (vite hashed filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend (internal network only)
    client_max_body_size 35M;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 35M;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        expires 30d;
        add_header Cache-Control "public";
        # nginx 의 add_header 는 현재 레벨에 하나라도 있으면 상위를 상속하지 않는다.
        # 위에 Cache-Control 이 있으므로 server 레벨의 nosniff 가 여기엔 적용되지
        # 않는다. 사용자 업로드가 서빙되는 경로라 반드시 다시 지정해야 한다.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}

server {
    listen 8080;
    server_name localhost;
    return 301 https://$host$request_uri;
}
